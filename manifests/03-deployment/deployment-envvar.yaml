apiVersion: apps/v1
kind: Deployment
metadata:
  name: <APP_NAME>
  namespace: <K8S_NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <APP_NAME>
  template:
    metadata:
      labels:
        app: <APP_NAME>
    spec:
      containers:
        - name: <APP_NAME>
          image: <CONTAINER_IMAGE>
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: <K8S_SECRET_NAME>
                  key: API_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: <K8S_SECRET_NAME>
                  key: DB_PASSWORD
